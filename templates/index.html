<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>おみくじ</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, -apple-system, sans-serif;
        background: #f9fafb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #fff, #f2f6ff 40%),
                    radial-gradient(circle at 80% 0%, #fef4ff, #f5f8ff 40%),
                    #f9fafb;
        color: #1f2937;
      }

      .card {
        width: min(540px, 92vw);
        background: #ffffffee;
        backdrop-filter: blur(6px);
        padding: 28px 24px 24px;
        box-shadow: 0 16px 50px rgba(31, 41, 55, 0.12);
        border-radius: 16px;
        border: 1px solid #e5e7eb;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 32px;
        letter-spacing: 0.04em;
      }

      p.lead {
        margin: 0 0 22px;
        color: #4b5563;
        line-height: 1.7;
      }

      .result {
        padding: 18px;
        border-radius: 12px;
        border: 1px dashed #cbd5e1;
        background: #f8fafc;
        min-height: 110px;
        display: grid;
        gap: 6px;
        align-content: center;
        justify-items: start;
      }

      .result .title {
        font-size: 26px;
        font-weight: 700;
        color: #334155;
      }

      .result .desc {
        color: #475569;
        line-height: 1.6;
      }

      .buttons {
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      button#draw {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: white;
        box-shadow: 0 12px 30px rgba(79, 70, 229, 0.35);
      }

      button#draw:hover { transform: translateY(-1px); box-shadow: 0 14px 34px rgba(79,70,229,0.35); }
      button#draw:active { transform: translateY(0); }

      button#reset {
        background: #e5e7eb;
        color: #374151;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      footer {
        margin-top: 14px;
        color: #6b7280;
        font-size: 13px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>おみくじ</h1>
      <p class="lead">ボタンを押して今日の運勢を引いてみよう！</p>
      <div class="result" id="result">
        <div class="title" id="fortune-title">…</div>
        <div class="desc" id="fortune-desc">ボタンを押しておみくじを引こう。</div>
      </div>
      <div class="buttons">
        <button id="draw">おみくじを引く</button>
        <button id="reset" disabled>リセット</button>
      </div>
      <footer>リロードせず何度でも引けます</footer>
    </main>

    <script>
      const titleEl = document.getElementById("fortune-title");
      const descEl = document.getElementById("fortune-desc");
      const drawButton = document.getElementById("draw");
      const resetButton = document.getElementById("reset");

      async function drawFortune() {
        drawButton.disabled = true;
        drawButton.textContent = "引いています…";
        try {
          const response = await fetch("/draw");
          const fortune = await response.json();
          titleEl.textContent = fortune.title;
          descEl.textContent = fortune.description;
          resetButton.disabled = false;
        } catch (error) {
          titleEl.textContent = "取得に失敗しました";
          descEl.textContent = "時間をおいてもう一度お試しください。";
        } finally {
          drawButton.disabled = false;
          drawButton.textContent = "おみくじを引く";
        }
      }

      function resetFortune() {
        titleEl.textContent = "…";
        descEl.textContent = "ボタンを押しておみくじを引こう。";
        resetButton.disabled = true;
      }

      drawButton.addEventListener("click", drawFortune);
      resetButton.addEventListener("click", resetFortune);
    </script>
  </body>
</html>
